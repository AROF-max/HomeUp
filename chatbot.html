            stroke="currentColor"

                y1="6"
                x2="12"
                y2="18"

    ======================================================== -->

        </div>

             AI TOOLS / SUGGESTIONS
        ==================================================== -->

        <div class="suggestions">


            <!-- AUTOFILL -->

            <button
                type="button"
                class="chip"
                data-prompt="Could you help me fill out this form?"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"

                    stroke-linejoin="round"

                    <path d="M15.5 18.5l4-4"/>

                    <path d="M18.5 18.5l-1.2 1.2"/>

                    <rect
                        x="4"
                        y="3"
                        width="16"
                        height="18"
                        rx="2"
                    />

                </svg>


                <div class="chip-text">

                    <span class="chip-title">
                        Autofill Form
                    </span>

                    <span class="chip-description">
                        Fill documents with AI
                    </span>

                </div>

            </button>



            <!-- REMINDER -->

            <button
                type="button"
                class="chip"
                data-prompt="Could you help me set a reminder?"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"

                        cy="13"
                        r="7"

                    <path d="M6 4L4 6"/>

                    <path d="M18 4l2 2"/>

                </svg>


                <div class="chip-text">

                    <span class="chip-title">
                        Set a reminder
                    </span>

                    <span class="chip-description">
                        Remember anything, anytime
                    </span>

                </div>

            </button>



            <!-- CALENDAR EVENT -->

            <button
                type="button"
                class="chip"
                data-prompt="Could you help me schedule an event?"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"

                    <span class="chip-title">

                    </span>

                    <span class="chip-description">
                        Plan your calendar
                    </span>

                </div>

            </button>



            <!-- VISA -->

            <button
                type="button"
                class="chip"
                data-prompt="Could you help me with my visa?"

                    xmlns="http://www.w3.org/2000/svg"

                    height="22"

                <div class="chip-text">

                    <span class="chip-title">
                        Help with visa
                    </span>

                    <span class="chip-description">
                        Get visa guidance
                    </span>

                </div>

            </button>

    <form
        class="talk"
        autocomplete="off"
    >


        <div id="attachment-container"></div>


        <div class="input-chat">


            <!-- ATTACH BUTTON -->

            <button
                type="button"
                class="attach-btn"
                aria-label="Attach"
            >

                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">

                <path d="M12 5v14"/>
                <path d="M5 12h14"/>

            </svg>

            </button>



            <!-- TEXT INPUT -->

            <textarea
    id="chatbot-talk"
    class="chat-field"
    placeholder=""
    rows="1"
></textarea>



            <!-- MICROPHONE -->

            <button
                id="micButton"
                class="mic-btn"
                type="button"
                aria-label="Voice input"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="1 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M6 9v6"/>
                    <path d="M10 6v12"/>
                    <path d="M14 3v18"/>
                    <path d="M18 8v8"/>

                </svg>

            </button>



            <!-- SEND -->

            <button
                type="submit"
                class="send-btn"
                aria-label="Send"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"

                    <path d="M7 11l5-5 5 5"/>

                </svg>

            </button>

                            cx="12"
                            cy="13"
                            r="4"
                        />

                    </svg>

                    <span>Take Photo</span>

                </button>



                <!-- IMAGE -->

                <button
                    type="button"
                    class="menu-item-upload"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="3"
                            y="4"
                            width="18"
                            height="16"
                            rx="2"
                        />

                        <circle
                            cx="9"
                            cy="9"
                            r="1.5"
                        />

                        <path d="M21 16l-5-5-7 7"/>

                    </svg>

                    <span>Upload Image</span>

                </button>



                <!-- FILE -->

                <button
                    type="button"
                    class="menu-item-file"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M14 2H7a2 2 0 0 0-2 2v16

                        <path d="M8 16h8"/>

                        <path d="M8 12h4"/>

                    <span>Upload File</span>

                </button>


            </div>


        </div>



        <!-- FILE INPUTS -->

        <input

            multiple

        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden
        >


        <input
            type="file"
            id="scanInput"
            accept="image/*,.pdf"
            multiple
            hidden
        >


        <input
            type="file"
            id="fileUpload"
            multiple
            hidden
        >


    </form>
