  <main class="calendar-page">

    <header class="calendar-header">

        <div>
            <h1>Calendar</h1>
            <p>Keep your family organized.</p>
        </div>

        <button id="add-event-btn" type="button">
            + Add event
        </button>

    </header>


    <section class="calendar-toolbar">

        <div class="calendar-header">

    <button id="prev-month" class="month-btn" type="button" aria-label="Previous month">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </button>

    <h2 id="month-title">August 2026</h2>

    <button id="next-month" class="month-btn" type="button" aria-label="Next month">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
        </svg>
    </button>

</div>

        <button id="today-btn" type="button">
            Today
        </button>

    </section>


    <section class="calendar" aria-label="Calendar">

        <div class="calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="calendar-days" class="calendar-days">
        </div>

    </section>

</main>
